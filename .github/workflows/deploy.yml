name: Desplegar ambiente

# Workflow reutilizable: infraestructura (Bicep) + app (Static Web Apps) + smoke test + rollback.
on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  deploy:
    name: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.infra.outputs.url }}
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
    steps:
      - uses: actions/checkout@v4

      # OIDC: sin contraseñas guardadas. La identidad solo tiene permisos sobre el grupo de recursos.
      - name: Login en Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Infraestructura (Bicep)
        id: infra
        run: |
          out=$(az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "pipeline-${{ inputs.environment }}-${{ github.run_number }}" \
            --template-file infra/main.bicep \
            --parameters environment=${{ inputs.environment }} alertEmail="${{ vars.ALERT_EMAIL }}" \
            --query properties.outputs -o json)
          echo "swa=$(jq -r .swaName.value <<<"$out")" >> "$GITHUB_OUTPUT"
          echo "url=https://$(jq -r .swaHostname.value <<<"$out")" >> "$GITHUB_OUTPUT"

      # El token de despliegue se pide en el momento con la identidad OIDC: no se guarda en GitHub.
      - name: Obtener token de despliegue
        id: token
        run: |
          token=$(az staticwebapp secrets list -n "${{ steps.infra.outputs.swa }}" -g "$RESOURCE_GROUP" --query properties.apiKey -o tsv)
          echo "::add-mask::$token"
          echo "value=$token" >> "$GITHUB_OUTPUT"

      - name: Marcar versión
        run: echo "{\"sha\":\"${{ github.sha }}\",\"environment\":\"${{ inputs.environment }}\"}" > src/web/version.json

      - name: Desplegar app
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.value }}
          action: upload
          app_location: src/web
          api_location: src/api
          output_location: ''
          skip_app_build: true

      - name: Smoke test
        run: bash scripts/smoke.sh "${{ steps.infra.outputs.url }}" "${{ github.sha }}"

      # ---------- Rollback automático ----------
      # Si el smoke test falla, se vuelve a desplegar el commit de la última ejecución exitosa.
      - name: Buscar última versión buena
        id: good
        if: failure() && steps.deploy.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci-cd.yml --branch main \
                --status success --limit 1 --json headSha -q '.[0].headSha')
          echo "Última versión buena: ${sha:-ninguna}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout de la versión buena
        if: failure() && steps.good.outputs.sha != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.good.outputs.sha }}
          path: rollback

      - name: Marcar versión de rollback
        if: failure() && steps.good.outputs.sha != ''
        run: echo "{\"sha\":\"${{ steps.good.outputs.sha }}\",\"environment\":\"${{ inputs.environment }}\",\"rollback\":true}" > rollback/src/web/version.json

      - name: Rollback
        if: failure() && steps.good.outputs.sha != ''
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.value }}
          action: upload
          app_location: rollback/src/web
          api_location: rollback/src/api
          output_location: ''
          skip_app_build: true

      - name: Verificar rollback
        if: failure() && steps.good.outputs.sha != ''
        run: bash scripts/smoke.sh "${{ steps.infra.outputs.url }}" "${{ steps.good.outputs.sha }}"
